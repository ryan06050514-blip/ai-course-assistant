server {
    listen 80;

    # 展示層：靜態網頁
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # 反向代理：/api/xxx 轉給應用層的 /xxx
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 180s;   # 本地模型回應較慢
        proxy_buffering    off;    # 第 6 週：串流回應不要被緩衝
    }
}
